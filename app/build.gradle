plugins {
    id 'com.android.application'
}

android {
    namespace 'app.kadam.walkearn'
    compileSdk 34

    defaultConfig {
        applicationId 'app.kadam.walkearn'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
